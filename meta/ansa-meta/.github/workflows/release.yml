# Автоматичен Release: при всеки push в main чете версията от ansa-meta.php (header Version: и ANSA_META_VER трябва да съвпадат).
# Ако таг vX.Y.Z за нея още няма — php -l, офлайн тестовете, ansa-meta.zip (папка ansa-meta/ вътре, както WP го очаква),
# тагът и Release-ът. Сайтът (proclaudecopilot GitHub Updater, header „GitHub Plugin URI: proclaudecopilot/ansa-meta“) вижда
# новия release и се обновява (Update now / auto-updates). След release-а пингва сайта — нужни са secrets PCC_HOOK_URL и
# PCC_HOOK_SECRET (Settings → GitHub ъпдейти на сайта); без тях само предупреждава и сайтът го вижда при следващата проверка (до 6 ч).
# Ръчно „Run workflow“ (workflow_dispatch) само пингва сайта за текущата версия, ако тагът ѝ вече го има.
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency: release
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Read version
        id: v
        run: |
          VER=$(grep -m1 -E '^\s*\*\s*Version:' ansa-meta.php | sed -E 's/.*Version:\s*//; s/\s+$//')
          CONST=$(grep -m1 -E "define\(\s*'ANSA_META_VER'" ansa-meta.php | sed -E "s/.*'ANSA_META_VER'[^']*'([0-9.]+)'.*/\1/")
          echo "header=$VER const=$CONST"
          [ -n "$VER" ] && [ "$VER" = "$CONST" ] || { echo "::error::Version: ($VER) и ANSA_META_VER ($CONST) не съвпадат"; exit 1; }
          if git ls-remote --exit-code --tags origin "v$VER" >/dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; echo "Таг v$VER вече има — няма нов release"; else echo "exists=0" >> "$GITHUB_OUTPUT"; fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
      - name: PHP lint + офлайн тестове
        run: |
          sudo apt-get install -y -qq php-cli >/dev/null 2>&1 || true
          php -v | head -1
          for f in $(find . -name '*.php' -not -path './.git/*'); do php -l "$f" >/dev/null || exit 1; done
          php tests/identity-test.php
          php tests/capi-test.php
      - name: Build zip
        if: steps.v.outputs.exists == '0'
        run: |
          mkdir -p build/ansa-meta
          rsync -a --exclude '.git' --exclude '.github' --exclude 'build' --exclude 'tests' --exclude '.gitignore' --exclude '.gitattributes' --exclude '*.zip' ./ build/ansa-meta/
          cd build && zip -qr ../ansa-meta.zip ansa-meta && cd ..
          unzip -l ansa-meta.zip | tail -1
      - name: Release v${{ steps.v.outputs.ver }}
        if: steps.v.outputs.exists == '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.ver }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.v.outputs.ver }}
          files: ansa-meta.zip
          generate_release_notes: true
      - name: Ping сайта → обнови се сега
        if: steps.v.outputs.exists == '0' || github.event_name == 'workflow_dispatch'
        env:
          URLS: ${{ secrets.PCC_HOOK_URL }}
          SECRET: ${{ secrets.PCC_HOOK_SECRET }}
          REPO: ${{ github.repository }}
          VER: ${{ steps.v.outputs.ver }}
        run: |
          if [ -z "$URLS" ] || [ -z "$SECRET" ]; then
            echo "::warning::Няма secrets PCC_HOOK_URL / PCC_HOOK_SECRET — сайтът ще види v$VER при следващата си проверка (до 6 ч + WP крон). Вземи ги от Settings → GitHub ъпдейти на сайта."
            exit 0
          fi
          sleep 5
          fail=0
          for URL in $(printf '%s' "$URLS" | tr ',;' '  '); do
            ok=0
            for i in 1 2 3; do
              echo "→ $URL (опит $i)"
              out=$(curl -sS -m 280 -X POST "$URL" -H "X-PCC-Secret: $SECRET" --data-urlencode "repo=$REPO" -w '\nHTTP %{http_code}' || true)
              echo "$out"
              good=$(printf '%s' "$out" | head -n1 | REPO="$REPO" VER="$VER" python3 -c 'import sys,json,os; d=json.load(sys.stdin); print(1 if any(p.get("repo")==os.environ["REPO"] and p.get("after")==os.environ["VER"] for p in d.get("plugins",[])) else 0)' 2>/dev/null || echo 0)
              if [ "$good" = 1 ]; then ok=1; break; fi
              case "$out" in *"HTTP 200"*|*"HTTP 500"*) echo "::warning::Сайтът отговори, но не докладва $REPO на версия $VER (плъгинът липсва, auto-updates са изключени или token-ът няма достъп до repo-то)";; esac
              sleep $((i*20))
            done
            [ "$ok" = 1 ] || { echo "::error::$URL не се обнови до v$VER — виж отговора горе."; fail=1; }
          done
          exit $fail
