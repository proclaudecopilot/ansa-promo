<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ansa™ Розово Тримесечие — мокъп v73 (три кутии)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>:root{--o:#e8722a;--o2:#f59e0b;--od:#c2410c;--os:rgba(232,114,42,.07);--ol:rgba(232,114,42,.28);--cream:#faf3ec;--ink:#1a1a2e;--ink2:#2d2d3f;--tan:#8a6a55;--tan2:#a88a75;--muted:#6b5f58;--g:#16a34a;--gd:#15803d;--gs:rgba(34,197,94,.08);--v:#6366f1;--v2:#a78bfa;--gold:#f0b429;--goldd:#b45309}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Nunito',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--cream);color:var(--ink);font-size:15px;line-height:1.4;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 500px at 50% -120px,rgba(232,114,42,.10),transparent 60%),radial-gradient(600px 400px at 100% 100%,rgba(245,158,11,.06),transparent 60%)}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px 120px}
/* dev */
.dev{background:#1a1a2e;color:#c4a882;font-size:11px;padding:6px 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center}
.dev button{font:inherit;font-weight:800;border:none;border-radius:999px;padding:4px 9px;background:#2d2d3f;color:#fff}
.dev button.on{background:var(--o)}
/* header */
.hdr{position:sticky;top:0;z-index:35;background:rgba(250,243,236,.96);backdrop-filter:blur(10px);margin:0 -14px;padding:8px 14px 8px;border-bottom:1px solid rgba(232,114,42,.15)}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-size:19px;font-weight:800;letter-spacing:-.02em}.brand b{color:var(--o);font-weight:900}
.topr{margin-left:auto;display:flex;align-items:center;gap:8px}
.how{border:1px solid var(--ol);background:#fff;color:#b35a20;font-size:11.5px;font-weight:800;border-radius:8px;padding:6px 10px}
.timer{font-size:12px;font-weight:800;color:var(--od);background:var(--os);border-radius:8px;padding:6px 10px;white-space:nowrap}
.timer b{font-variant-numeric:tabular-nums}
.timer.hot{background:#fee2e2;color:#b91c1c;animation:tpulse 1s ease-in-out infinite}
@keyframes tpulse{50%{opacity:.7}}
.boxchip{display:none;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--ol);border-radius:10px;padding:5px 10px;font-size:12.5px;font-weight:800}
.boxchip .sw{border:none;background:none;color:var(--o);font-weight:800;text-decoration:underline;font-size:12px}
.hdr.builder .boxchip{display:inline-flex}
/* generic */
.card{background:#fff;border:1.5px solid var(--ol);border-radius:16px;padding:16px;box-shadow:0 6px 24px rgba(232,114,42,.10),0 1px 3px rgba(67,48,42,.06)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:none;border-radius:14px;background:linear-gradient(135deg,#ef8c4f 0%,#e8722a 50%,#e56b50 100%);color:#fff;font-size:16px;font-weight:800;padding:12px 18px;box-shadow:0 6px 20px rgba(232,114,42,.25);position:relative;overflow:hidden;transition:filter .2s,transform .15s}
.cta:hover{filter:brightness(1.06);transform:translateY(-1px)}
.cta:disabled{background:#e6dcd3;color:#a08c7d;box-shadow:none;cursor:not-allowed;transform:none;filter:none}
.cta.soft{background:#fff;color:var(--od);border:2px solid var(--o);box-shadow:none}
.cta.gold{background:linear-gradient(135deg,#d97706,#f59e0b);box-shadow:0 6px 20px rgba(240,180,41,.35)}
.cta::after{content:"";position:absolute;top:0;left:-100%;width:60%;height:100%;pointer-events:none;background:linear-gradient(105deg,transparent 20%,rgba(255,255,255,.12) 40%,rgba(255,255,255,.22) 50%,rgba(255,255,255,.12) 60%,transparent 80%);animation:shim 5s ease-in-out infinite}
.cta.soft::after,.cta:disabled::after{display:none}
@keyframes shim{0%,70%{left:-100%;opacity:0}78%{opacity:1}100%{left:150%;opacity:0}}
.lnk{border:none;background:none;font-size:13px;font-weight:800;color:var(--o);text-decoration:underline;padding:0}
.k2{font-size:11px;font-weight:800;color:var(--tan);text-transform:uppercase;letter-spacing:.07em;margin:14px 0 8px}
.scr{display:none}.scr.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:26px;font-weight:900;letter-spacing:-.02em;line-height:1.15}
h2{font-size:21px;font-weight:900;letter-spacing:-.02em}
.lead{font-size:14.5px;color:var(--muted);font-weight:600;margin:6px 0 14px}
/* ═══ ЕКРАН 1: избор на кутия ═══ */
.yban{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin:12px 0 14px;padding:14px 18px;border-radius:16px;background:linear-gradient(135deg,#ef8c4f,#e8722a 55%,#e56b50);color:#fff;box-shadow:0 8px 24px rgba(232,114,42,.3)}
.yban i{font-style:normal;font-size:40px;line-height:1}
.yban b{display:block;font-size:19px;font-weight:900;line-height:1.2}
.yban small{display:block;font-size:13px;font-weight:700;opacity:.95;margin-top:3px}
.boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:stretch}
.box{position:relative;display:flex;flex-direction:column;background:#fff;border:2px solid var(--ol);border-radius:18px;padding:18px 16px 16px;box-shadow:0 6px 24px rgba(232,114,42,.10);transition:transform .2s,box-shadow .2s}
.box:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(232,114,42,.18)}
.box.m{border-color:var(--o)}
.box.l{border-color:var(--gold);background:linear-gradient(180deg,#fffdf5,#fff)}
.btag{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#fff;border-radius:999px;padding:5px 12px;white-space:nowrap}
.box.m .btag{background:linear-gradient(135deg,var(--o),var(--o2))}
.box.l .btag{background:linear-gradient(135deg,#d97706,#f59e0b)}
.bico{font-size:44px;line-height:1;text-align:center;margin:4px 0 6px}
.bname{text-align:center;font-size:19px;font-weight:900}
.bpacks{text-align:center;font-size:13px;font-weight:700;color:var(--tan);margin-bottom:10px}
.bpct{text-align:center;margin:4px 0 10px}
.bpct b{display:inline-block;font-size:34px;font-weight:900;color:var(--o);line-height:1}
.box.l .bpct b{color:var(--goldd)}
.bpct small{display:block;font-size:12px;font-weight:700;color:var(--tan)}
.brw{display:grid;gap:6px;margin:6px 0 12px;flex:1}
.br{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:center;font-size:13px;font-weight:700;color:var(--ink);background:var(--gs);border:1px solid rgba(34,197,94,.2);border-radius:10px;padding:6px 9px}
.br i{font-style:normal;width:28px;height:28px;border-radius:8px;background:#fff;border:1px solid rgba(34,197,94,.25);display:flex;align-items:center;justify-content:center;font-size:15px}
.br.no{background:#f6f1ec;border-color:rgba(0,0,0,.06);color:#a89a90;text-decoration:line-through}
.br.no i{filter:grayscale(1);opacity:.5;border-color:rgba(0,0,0,.08)}
.br small{display:block;font-size:11px;font-weight:600;color:var(--tan);text-decoration:none}
.bsave{text-align:center;font-size:13px;font-weight:800;color:var(--gd);background:var(--gs);border-radius:10px;padding:7px;margin-bottom:10px}
.bsave b{font-size:16px;font-weight:900}
.bfrom{text-align:center;font-size:12.5px;font-weight:700;color:var(--tan);margin-bottom:10px}
.bfrom b{color:var(--ink);font-size:15px}
.box .cta{margin-top:auto;min-height:50px;font-size:15px}
.guarl{text-align:center;font-size:12.5px;font-weight:700;color:var(--tan);margin-top:14px}
/* ═══ ЕКРАН 2: builder ═══ */
#s2.on{display:grid;grid-template-columns:minmax(0,1fr) 400px;column-gap:22px;align-items:start}
.colL{min-width:0}
.bhead{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;margin:12px 0}
.bhead .bi{font-size:40px;line-height:1}
.bhead h2{font-size:22px}
.bhead .sub{font-size:13.5px;color:var(--muted);font-weight:600}
.slots{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 6px}
.slot{width:74px;height:74px;border-radius:18px;border:2.5px dashed rgba(232,114,42,.4);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;font-size:28px;transition:all .25s}
.slot.filled{border:2.5px solid var(--g);background:linear-gradient(145deg,#fff6ee,#ffe3cf);box-shadow:0 4px 12px rgba(34,197,94,.2);animation:slotPop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes slotPop{0%{transform:scale(.6)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
.slot.empty .n{font-size:12px;font-weight:900;color:var(--tan2)}
.slot.empty .q{font-size:22px;color:var(--tan2)}
.slot .x{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:#fff;border:1.5px solid var(--ol);color:var(--od);font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center}
.slot small{position:absolute;bottom:-18px;font-size:10px;font-weight:800;color:var(--tan);white-space:nowrap}
.slot.next{border-color:var(--o);box-shadow:0 0 0 4px rgba(232,114,42,.15);animation:nextPulse 1.6s ease-in-out infinite}
@keyframes nextPulse{50%{box-shadow:0 0 0 8px rgba(232,114,42,.08)}}
.sline{font-size:14px;font-weight:800;margin:24px 0 6px}
.sline b{color:var(--o)}
.sline.done{color:var(--gd)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:8px}
.tile{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:8px 12px;align-items:start;background:#fff;border:1.5px solid var(--ol);border-radius:14px;padding:12px;box-shadow:0 2px 10px rgba(232,114,42,.07);transition:all .2s}
.tile.on{border-color:var(--g);background:#fbfff9}
.tile .pic{width:56px;height:56px;border-radius:14px;background:linear-gradient(145deg,#fff6ee,#ffe3cf);display:flex;align-items:center;justify-content:center;font-size:30px}
.tile .mid b{display:block;font-size:15px;font-weight:800}
.tile .mid small{display:block;font-size:12px;color:var(--tan);font-weight:600}
.tile .mid .desc{display:block;font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:3px}
.tile .act{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid rgba(232,114,42,.12)}
.tile .pr{font-size:16px;font-weight:800;color:var(--o)}.tile .pr s{font-size:11px;color:var(--tan2);font-weight:500;margin-left:5px}
.addb{border:none;border-radius:11px;background:linear-gradient(135deg,var(--o),var(--o2));color:#fff;font-size:13px;font-weight:800;padding:9px 14px;box-shadow:0 2px 8px rgba(232,114,42,.25)}
.addb:disabled{background:#e6dcd3;color:#a08c7d;box-shadow:none;cursor:not-allowed}
.step{display:flex;align-items:center;gap:4px}
.step button{width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(232,114,42,.35);background:#fff;color:var(--o);font-weight:900;font-size:17px;line-height:1}
.step button:disabled{opacity:.3;cursor:not-allowed}
.step b{min-width:22px;text-align:center;font-weight:900}
/* push към по-голяма кутия */
.push{margin-top:16px;border:2px solid var(--gold);border-radius:16px;background:linear-gradient(135deg,#fff8e6,#fff1cc);padding:14px 16px;box-shadow:0 6px 18px rgba(240,180,41,.25)}
.push .ph{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:900;color:var(--goldd)}
.push .ph i{font-style:normal;font-size:24px}
.push .pl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.push .pl div{background:#fff;border:1px solid rgba(240,180,41,.5);border-radius:10px;padding:8px;text-align:center;font-size:12.5px;font-weight:800;color:var(--ink)}
.push .pl div i{display:block;font-style:normal;font-size:20px;margin-bottom:3px}
.push .ps{font-size:13px;font-weight:700;color:var(--goldd);margin-bottom:10px;text-align:center}
.push .ps b{font-size:15px}
/* панел */
.colR{position:sticky;top:120px}
.order{padding:14px 14px 12px}
.ohead{font-size:15px;font-weight:800;margin-bottom:8px}
.orow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid rgba(232,114,42,.08);font-size:13px;font-weight:700}
.orow:first-of-type{border-top:none}
.orow .pic{width:28px;height:28px;border-radius:8px;background:linear-gradient(145deg,#fff6ee,#ffe3cf);display:flex;align-items:center;justify-content:center;font-size:16px}
.orow .n{flex:1}.orow .p{font-weight:800;white-space:nowrap}.orow .p s{font-size:10px;color:var(--tan2);font-weight:500;margin-left:3px}
.orow.empty{color:var(--tan2);font-weight:600;font-style:italic}
.ostat{margin:8px 0;padding:8px 11px;border-radius:10px;background:linear-gradient(135deg,#fff6ee,#fff1e5);border:1.5px solid rgba(232,114,42,.35);font-size:13.5px;font-weight:700}
.ostat b{color:var(--o);font-weight:900}
.rl{display:grid;gap:5px}
.rr{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:7px 9px;border-radius:11px;border:1px solid rgba(232,114,42,.14);background:#fffdfb;cursor:pointer}
.rr.lk{border-color:rgba(0,0,0,.07);background:#fbf9f7}
.rim{position:relative;width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,#fff6ee,#ffe3cf);border:1.5px solid rgba(232,114,42,.3);display:flex;align-items:center;justify-content:center;font-size:20px}
.rim em{position:absolute;right:-5px;bottom:-5px;width:17px;height:17px;border-radius:50%;background:var(--g);color:#fff;font-size:9px;font-weight:900;display:flex;align-items:center;justify-content:center;font-style:normal;border:2px solid #fff}
.rr.lk .rim{background:#f3ede8;filter:grayscale(1);opacity:.7}.rr.lk .rim em{background:#9ca3af}
.rtx b{display:block;font-size:13px;font-weight:800;line-height:1.25}.rtx small{display:block;font-size:11.5px;color:var(--tan);font-weight:600}
.rr.lk .rtx b{color:var(--tan)}
.rr.unlock{animation:unlockPop .9s cubic-bezier(.2,1.4,.4,1)}
@keyframes unlockPop{0%{transform:scale(.7);filter:grayscale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
.vline{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;margin:10px 0 8px}
.vl{border-radius:10px;padding:6px 10px;text-align:center}
.vl em{display:block;font-style:normal;font-size:9.5px;font-weight:900;text-transform:uppercase;letter-spacing:.05em}
.vl b{display:block;font-size:18px;font-weight:900;line-height:1.1}
.vl small{display:block;font-size:10.5px;font-weight:600;margin-top:1px}
.vl.pay{background:#fff;border:1.5px solid rgba(232,114,42,.35)}.vl.pay em,.vl.pay small{color:var(--tan)}.vl.pay b{color:var(--o)}
.vl.get{background:linear-gradient(135deg,#e8f7ec,#d8f2df);border:1.5px solid rgba(34,197,94,.45)}.vl.get em,.vl.get b{color:var(--gd)}.vl.get small{color:#166534}
.vlarr{width:22px;height:22px;border-radius:50%;background:#fff;border:1.5px solid rgba(232,114,42,.35);color:var(--o);font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center}
.trust{font-size:11.5px;font-weight:600;color:var(--tan);text-align:center;margin-top:6px}
.lnkq{text-decoration:underline;cursor:pointer}
/* sticky bar (mobile) */
.sticky{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,253,251,.97);border-top:1.5px solid var(--ol);box-shadow:0 -4px 20px rgba(0,0,0,.08);padding:6px 14px calc(8px + env(safe-area-inset-bottom,0px))}
.sticky .ribbon{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;padding:5px 10px;border-radius:8px;font-size:12px;font-weight:700;background:#fff;border:1px solid var(--ol);margin-bottom:5px}
.sticky .ribbon b{font-size:13.5px;font-weight:900}.sticky .ribbon .rp b{color:var(--o)}.sticky .ribbon .rg{text-align:right;color:#166534}.sticky .ribbon .rg b{color:var(--gd)}
.sticky .cta{min-height:46px;font-size:15px}
/* toast */
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%) translateY(-20px);z-index:60;background:#fff;color:var(--gd);border-radius:12px;padding:10px 16px;font-size:13px;font-weight:800;box-shadow:0 8px 28px rgba(232,114,42,.22);border:1.5px solid rgba(34,197,94,.3);opacity:0;pointer-events:none;transition:all .3s;display:flex;gap:10px;align-items:center;max-width:calc(100% - 28px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast.lock{border-color:var(--o);color:var(--od)}
.tundo{border:none;background:var(--o);color:#fff;font-size:12.5px;font-weight:900;border-radius:999px;padding:5px 11px}
/* popups */
.ov{position:fixed;inset:0;z-index:70;background:rgba(26,26,46,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px}
.ov.off{display:none}
.dc{width:100%;max-width:560px;max-height:calc(100dvh - 32px);overflow:auto;background:#fff;border-radius:22px;padding:20px 22px;box-shadow:0 20px 60px rgba(26,26,46,.3);position:relative;animation:up .3s ease}
.dc.wide{max-width:820px}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.dc h3{font-size:19px;font-weight:900;letter-spacing:-.02em;margin-bottom:6px;padding-right:36px}
.dc .ux{position:absolute;top:14px;right:16px;width:30px;height:30px;border-radius:50%;border:none;background:var(--os);color:var(--od);font-weight:900}
.ib{font-size:14px;line-height:1.5;color:var(--ink2)}.ib p{margin:6px 0}.ib .mut{color:var(--tan);font-size:12.5px}
.ib .il{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border-radius:9px;background:rgba(232,114,42,.04);margin:5px 0;font-size:13px}
.ib .il span:first-child{color:var(--tan);font-weight:700}.ib .il b{color:var(--ink)}
.dc .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
/* Сигурен ли си */
.dcx{text-align:center}
.dpill{display:inline-block;font-size:11.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#b35a20;background:var(--os);border-radius:999px;padding:6px 14px}
.dbig{font-size:32px;font-weight:900;letter-spacing:-.02em;margin:10px 0 14px}
.dbox{text-align:left;background:#fffaf5;border:1.5px solid rgba(232,114,42,.35);border-radius:16px;padding:14px}
.dbox em{display:block;font-style:normal;font-size:12.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--od);margin-bottom:10px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:#fff;border:1px solid rgba(232,114,42,.15);border-radius:12px;padding:8px 10px;margin-top:6px;font-size:15.5px;font-weight:700}
.dl i{font-style:normal;width:44px;height:44px;border-radius:12px;background:#fff6ee;border:1px solid rgba(232,114,42,.2);display:flex;align-items:center;justify-content:center;font-size:22px}
.dl b{color:#dc2626;font-weight:900;font-size:18px}
.dkeep{margin-top:10px;font-size:12.5px;font-weight:700;color:var(--gd);background:var(--gs);border-radius:10px;padding:7px 10px}
.dor{display:flex;align-items:center;gap:10px;margin:12px 0;color:var(--tan2);font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
.dor::before,.dor::after{content:"";flex:1;height:1px;background:rgba(232,114,42,.25)}
/* box chooser popup */
.bx3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.bx{border:2px solid var(--ol);border-radius:14px;padding:12px;text-align:center;cursor:pointer;background:#fff}
.bx.cur{border-color:var(--g);background:#f3fbf5}
.bx.l{border-color:var(--gold);background:#fffdf5}
.bx i{font-style:normal;font-size:30px;display:block}
.bx b{display:block;font-size:14px;font-weight:900;margin-top:4px}
.bx small{display:block;font-size:11.5px;color:var(--tan);font-weight:700}

    var fits=FIT[S.core]||[];
    var groups=CATS.map(function(c){return {c:c,ks:ORDER.filter(function(k){return PROD[k].cat===c})}}).filter(function(g){return g.ks.length});
    var body='<div class="pkhead">'+(rep?(repK?'Кой продукт да сложим вместо <b>'+PROD[repK].name+'</b>?':'Кой продукт да сложим на позиция <b>'+(S.replaceSlot+1)+'</b>?'):'Избери още <b>'+need+' '+opk(need)+'</b> за кутията си.')+'<small>Всички са с <b>−'+b.pct+'%</b> · докосни името за подробности</small></div>'
      +'<div class="pcat"><span class="pch">⭐ Препоръчани за теб</span><div class="plist">'+[S.core].concat(fits).map(prow).join('')+'</div></div>'
      +groups.map(function(g){return '<div class="pcat"><span class="pch">'+g.c+'</span><div class="plist">'+g.ks.map(prow).join('')+'</div></div>'}).join('');
    info(rep?(repK?'Замени продукта':'Позиция '+(S.replaceSlot+1)+' от '+b.packs):'Какво влиза в кутията?',body);
    var root=document.getElementById('dc');
    root.querySelectorAll('[data-add]').forEach(function(x){x.onclick=function(){var sc=root.scrollTop;var k=x.dataset.add;
      if(S.replaceSlot!=null){var wasEmpty=S.slots[S.replaceSlot]==null;S.slots[S.replaceSlot]=k;S.replaceSlot=null;closeInfo();render();if(full()&&wasEmpty)setTimeout(celebrate,350);else toast((wasEmpty?'✓ '+PROD[k].name+' е в кутията ти':'⇄ '+PROD[k].name+' замени предишния продукт'),false);return;}
      addSlot(k);if(full())closeInfo();else{pickerPopup();document.getElementById('dc').scrollTop=sc;}}});
    root.querySelectorAll('[data-p]').forEach(function(x){x.onclick=function(){prodInfo(x.dataset.p)}});
  }
  /* слот → детайл на продукта + замени / махни */
  function slotPopup(i){
    var k=S.slots[i],pr=PROD[k];
    info(pr.ph+' '+pr.name,'<p><b>'+pr.ds+'</b></p><p>'+pr.desc+'</p><p>60 капсули · за 30 дни</p><div class="il"><span>С −'+pct()+'% от кутията ти</span><b>'+m(r2(pr.price*(1-pct()/100)))+' <s style="color:#a88a75;font-weight:500">'+m(pr.price)+'</s></b></div>'
      +'<div class="sbtns"><button class="cta soft" id="sRep">↔ Замени с друг продукт</button><button class="cta soft" id="sRm">✕ Махни от кутията</button></div>');
    document.getElementById('sRep').onclick=function(){S.replaceSlot=i;pickerPopup();};
    document.getElementById('sRm').onclick=function(){closeInfo();removeSlot(i);};
  }
  function sureContinue(){
    if(S.box===2){go(4);return;}
    var cur=BX(),tgt=BOXES[S.box+1],diff=tgt.packs-cur.packs;
    var news=tgt.rw.filter(function(r){return cur.rw.indexOf(r)<0});
    var rows='<div class="dl"><i>💸</i><span>отстъпка <b>−'+tgt.pct+'%</b> вместо −'+cur.pct+'%</span></div>'+news.map(function(r){return '<div class="dl"><i>'+RW[r].ic+'</i><span>'+RW[r].t+'</span></div>'}).join('');
    var dc=document.getElementById('dc');dc.className='dc';S._lockOv=false;
    dc.innerHTML='<div class="dcx"><div class="dpill">'+cur.ic+' '+cur.name+' · '+cur.packs+' '+opk(cur.packs)+'</div><h3 class="dbig">Сигурна ли си, че продължаваш с тази кутия?</h3>'
      +'<p style="font-size:15px;font-weight:700;color:var(--ink2);margin-bottom:12px">Само още <b style="color:var(--od)">'+diff+' '+(diff===1?'продукт':'продукта')+'</b> те '+(diff===1?'дели':'делят')+' от <b>'+tgt.name.toLowerCase()+'</b> — и взимаш:</p>'
      +'<div class="dbox"><em>'+sPrep(tgt.name,true)+' '+tgt.name.toLowerCase()+' получаваш още:</em>'+rows+'</div>'
      +'<div class="dkeep">✓ Продуктите, които вече избра, остават в новата кутия · спестяваш до '+m0(boxSaveMax(tgt))+' вместо до '+m0(boxSaveMax(cur))+'</div>'
      +'<button class="cta gold" id="upNow" style="margin-top:14px">'+tgt.ic+' Смени на '+tgt.name.toLowerCase()+' и добави '+diff+' '+(diff===1?'продукт':'продукта')+'</button>'
      +(S.box===0?'<div style="margin-top:6px"><button class="lnk" id="upBig">или направо Голямата кутия: −40% · петорен шанс · козметичният сет за €1 ›</button></div>':'')
      +'<div class="dor"><span>или</span></div><button class="cta soft" id="keepGo">Продължавам '+sPrep(cur.name)+' '+cur.name.toLowerCase()+' →</button></div>';
    document.getElementById('ov').classList.remove('off');
    document.getElementById('upNow').onclick=function(){closeInfo();chooseBox(S.box+1,true)};
    var ub=document.getElementById('upBig');if(ub)ub.onclick=function(){closeInfo();chooseBox(2,true)};
    document.getElementById('keepGo').onclick=function(){closeInfo();go(4)};
  }
  /* смяна на кутия + „Сигурен ли си?“ */
  function switchPopup(){
    var b='<p class="mut">Продуктите, които вече си избрала, остават в новата кутия.</p><div class="bx3">'+BOXES.map(function(x,i){return '<div class="bx '+x.id+(i===S.box?' cur':'')+'" data-bx="'+i+'"><i>'+x.ic+'</i><b>'+x.name+'</b><small>'+x.packs+' '+opk(x.packs)+'</small><em>−'+x.pct+'%</em><small>'+x.rw.map(function(r){return RW[r].ic}).join(' ')+'</small>'+(i===S.box?'<small style="color:var(--gd);font-weight:900">✓ текущата</small>':'')+'</div>'}).join('')+'</div>';
    info('Смени кутията',b);
    document.querySelectorAll('.bx[data-bx]').forEach(function(x){x.onclick=function(){var to=+x.dataset.bx;if(to===S.box){closeInfo();return;}if(to<S.box)sureDown(to);else{closeInfo();chooseBox(to,true);}}});
  }
  function sureDown(to){
    var cur=BX(),tgt=BOXES[to];
    var lost=cur.rw.filter(function(r){return tgt.rw.indexOf(r)<0}).map(function(r){return '<div class="dl"><i>'+RW[r].ic+'</i><span>'+RW[r].t+'</span></div>'}).join('')
      +'<div class="dl"><i>💸</i><span>отстъпката пада на <b>−'+tgt.pct+'%</b> (вместо −'+cur.pct+'%)</span></div>';
    var dc=document.getElementById('dc');dc.className='dc';
    dc.innerHTML='<div class="dcx"><div class="dpill">Смяна към '+tgt.name+'</div><h3 class="dbig">Сигурна ли си?</h3>'
      +'<div class="dbox"><em>С по-малката кутия НЕ получаваш:</em>'+lost+'</div>'
      +'<div class="dkeep">✓ Участието в томболата за яхтата остава при всяка кутия</div>'
      +'<button class="cta gold" id="stay" style="margin-top:14px">'+cur.ic+' Оставам на '+cur.name.toLowerCase()+' — '+(boxes()<cur.packs?'още '+(cur.packs-boxes())+' '+opk(cur.packs-boxes()):(cur.id==='l'?'всички награди':cur.id==='m'?'3 билета + подаръци':'1 билет'))+'</button>'
      +'<div class="dor"><span>или</span></div><button class="cta soft" id="down">Сменям на '+tgt.name.toLowerCase()+' — без тези награди</button></div>';
    document.getElementById('ov').classList.remove('off');
    document.getElementById('stay').onclick=function(){if(S.screen!==2&&full()){celebrate()}else closeInfo()};
    document.getElementById('down').onclick=function(){closeInfo();chooseBox(to,true)};
  }

  /* подсказка при колебание */
  var hintT=null,hintId=null;
  function showHint(){var x=hintId&&document.getElementById(hintId);if(x&&full())x.classList.add('on')}
  function hideHint(){var x=hintId&&document.getElementById(hintId);if(x)x.classList.remove('on')}
  function armHint(id){hintId=id;clearTimeout(hintT);hideHint();hintT=setTimeout(showHint,8000)}
  ['click','keydown','scroll','touchstart'].forEach(function(ev){document.addEventListener(ev,function(){if(!hintId)return;hideHint();clearTimeout(hintT);hintT=setTimeout(showHint,8000)},{passive:true})});
  document.addEventListener('mouseleave',function(e){if(e.clientY<=0)showHint()});

  /* ── ЕКРАН 4: три любимци ── */
  function renderS4(){
    var el=document.getElementById('s4');if(S.box===null){el.innerHTML='';return;}
    var cart=S.slots.filter(Boolean).map(function(k){return PROD[k].name}).join(', '),cnt=Object.keys(S.secret).length,st=secretTotal();
    var h='<div class="narrow"><button class="back" id="b4">← обратно към кутията</button><span class="sbadge">🌸 Розова отстъпка −35% · само сега</span><h2>Три любими продукта с нашата розова отстъпка</h2><p class="lead">Перфектно се комбинират с кутията ти: <b>'+cart+'</b>. Не влизат в кутията — с фиксирана цена.</p><div class="tiles">';
    SECRETLIST().forEach(function(k){var pr=PROD[k],on=!!S.secret[k];h+='<div class="tile'+(on?' on':'')+'"><div class="pic">'+pr.ph+'</div><div class="mid"><b>'+pr.name+'</b><small>'+pr.ds+'</small><span class="desc">'+pr.desc.split('.')[0]+'.</span></div><div class="act"><div class="pr" style="color:#c2185b">'+m(r2(pr.price*0.65))+'<s>'+m(pr.price)+'</s></div><button class="addb" data-s="'+k+'"'+(on?' style="background:linear-gradient(135deg,#16a34a,#4ade80)"':'')+'>'+(on?'✓ Добавен':'＋ Добави')+'</button></div></div>'});
    h+='</div><div class="vline" style="max-width:520px;margin:14px auto 6px"><div class="vl pay"><em>Плащаш</em><b>'+m(r2(pay()+st))+'</b></div><div class="vlarr">→</div><div class="vl get"><em>Получаваш стойност за</em><b>'+m0(r2(value()+st/0.65))+'</b><small>спестяваш <b>'+m0(r2(value()+st/0.65-pay()-st))+'</b></small></div></div>'
      +'<div style="max-width:520px;margin:0 auto"><button class="cta" id="c4">'+(cnt?'Продължи с '+cnt+' любим'+(cnt===1?'ец':'ци')+' →':'Продължи към поръчката →')+'</button></div></div>';
    el.innerHTML=h;
    document.getElementById('b4').onclick=function(){go(2)};
    el.querySelectorAll('[data-s]').forEach(function(b){b.onclick=function(){var k=b.dataset.s;if(S.secret[k])delete S.secret[k];else S.secret[k]=1;render()}});
    document.getElementById('c4').onclick=function(){go(5)};
  }
  /* ── ЕКРАН 5: поръчка ── */
  function renderS5(){
    var el=document.getElementById('s5');if(S.box===null){el.innerHTML='';return;}
    var b=BX(),p=b.pct,st=secretTotal(),h='';
    h+='<div><button class="back" id="b5">← обратно</button><h2>Твоята поръчка и твоите награди</h2><div class="card sum" style="margin-top:10px">';
    h+='<div class="row"><span>'+b.ic+' '+b.name+' · '+b.packs+' '+opk(b.packs)+'<small>−'+p+'% на всички продукти в кутията</small></span><span></span></div>';
    var cnt={};S.slots.filter(Boolean).forEach(function(k){cnt[k]=(cnt[k]||0)+1});
    Object.keys(cnt).forEach(function(k){var pr=PROD[k],q=cnt[k];h+='<div class="row"><span>'+pr.ph+' '+pr.name+' × '+q+'</span><span>'+m(r2(pr.price*q*(1-p/100)))+'</span></div>'});
    b.rw.forEach(function(r){h+='<div class="row"><span>'+RW[r].ic+' '+RW[r].t+'<small>'+RW[r].s+'</small></span><span>'+(/^cosm/.test(r)?cosmPrice(r):(r==='book'?'€ 0':'вкл.'))+'</span></div>'});
    if(b.cosmPay!==null)h+='<label class="row cosmrow consent"><span><input type="checkbox" id="cosmOk"'+(S.cosm?' checked':'')+'> 🌸 Запазвам новия козметичен сет на ansa™ (5 продукта)<small>звъним ти, когато е готов (2027) · плащаш при получаване</small></span><span>'+m(b.cosmPay)+'<s>€ 129</s></span></label>';
    SECRETLIST().forEach(function(k){if(S.secret[k])h+='<div class="row"><span>'+PROD[k].ph+' '+PROD[k].name+'<small>−35% · любимец</small></span><span>'+m(r2(PROD[k].price*0.65))+'</span></div>'});
    h+='<div class="row"><span>🚚 Доставка</span><span>'+(ship()?m(SHIP):'безплатна')+'</span></div>'
      +'<div class="row tot"><span>Плащаш</span><span>'+m(r2(pay()+st))+lv(r2(pay()+st))+'</span></div>'
      +'<div class="vline"><div class="vl pay"><em>Плащаш</em><b>'+m(r2(pay()+st))+'</b></div><div class="vlarr">→</div><div class="vl get"><em>Получаваш стойност за</em><b>'+m0(r2(value()+st/0.65))+'</b><small>спестяваш <b>'+m0(r2(value()+st/0.65-pay()-st))+'</b></small></div></div>'
      +'<div class="guar">✅ Гаранция за удовлетвореност — ако не ти харесат продуктите, пиши ни. Ще те компенсираме. Подаръците си остават за теб.</div></div></div>';
    h+='<div><div class="card" style="margin-top:46px"><div class="k2" style="margin-top:0">Плащане</div><div class="pay">'
      +'<button data-p="card"'+(S.pay==='card'?' class="on"':'')+'><i>💳</i><span><b>С карта</b><small>Visa · Mastercard · Apple Pay</small></span><span class="rd"></span></button>'
      +'<button data-p="cod"'+(S.pay==='cod'?' class="on"':'')+'><i>📦</i><span><b>Наложен платеж</b><small>плащаш на куриера при доставка</small></span><span class="rd"></span></button>'
      +'</div><button class="cta" style="margin-top:12px">Завърши поръчката · '+m(r2(pay()+st))+'</button><div class="trust">🔒 Сигурно плащане · доставка 1–2 работни дни</div></div></div>';
    el.innerHTML=h;
    document.getElementById('b5').onclick=function(){go(1);setTimeout(celebrate,200)};
    var ck=document.getElementById('cosmOk');if(ck)ck.onchange=function(){S.cosm=ck.checked};
    el.querySelectorAll('[data-p]').forEach(function(b){b.onclick=function(){S.pay=b.dataset.p;render()}});
  }
  function render(){renderS1();renderS2();renderS4();renderS5()}

  document.querySelectorAll('.dev button').forEach(function(b){b.onclick=function(){document.querySelectorAll('.dev button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');S={box:null,slots:[],core:b.dataset.utm||null,secret:{},pay:'card',cosm:true,screen:1,utm:b.dataset.utm||null,_undo:null,timerEnd:null,replaceSlot:null};go(1)}});
  document.querySelector('.dev button[data-utm="sakura"]').click();
})();
</script>
</body>
</html>
