<title>ansa Black Friday емулатор</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: a demo bar on top (phase, emails, reset) and one phone-sized app below; the app inside keeps the ansa™ Промо look (cream, orange, Nunito) in both themes. */
:root{--bg:#ece6df;--fg:#1a1a2e;--bar:#ffffff;--bar-line:rgba(232,114,42,.25);--muted:#6b5f58;--accent:#e8722a;--accent-d:#c2410c;
  --o:#e8722a;--o2:#f59e0b;--od:#c2410c;--os:rgba(232,114,42,.07);--ol:rgba(232,114,42,.28);--cream:#faf3ec;--ink:#1a1a2e;--ink2:#2d2d3f;--tan:#8a6a55;--tan2:#a88a75;--mut:#6b5f58;--g:#16a34a;--gd:#15803d;--gs:rgba(34,197,94,.08);--gold:#f0b429;--goldd:#b45309;--bf:#0f0f1a;
  --font:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#17141a;--fg:#f3ede6;--bar:#221e25;--bar-line:rgba(232,114,42,.35);--muted:#b8aca3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17141a;--fg:#f3ede6;--bar:#221e25;--bar-line:rgba(232,114,42,.35);--muted:#b8aca3;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);display:flex;flex-direction:column;min-height:100%}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
/* demo bar */
.bar{background:var(--bar);border-bottom:1px solid var(--bar-line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:50}
.bar .t{font-weight:900;font-size:14px;letter-spacing:.02em;margin-right:4px}
.bar .t small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.bar .t .short{display:none}
@media (max-width:480px){.bar .t .long{display:none}.bar .t .short{display:inline}}
.seg{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:3px}
.seg button{border:none;background:transparent;color:var(--fg);font-weight:800;font-size:12.5px;padding:6px 10px;border-radius:8px;white-space:nowrap}
.seg button.on{background:var(--accent);color:#fff}
.bar .reset{margin-left:auto;border:1.5px solid var(--bar-line);background:transparent;color:var(--fg);font-weight:800;font-size:12px;border-radius:8px;padding:6px 10px}
.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:stretch;padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.phone{width:390px;max-width:100%;height:100%;max-height:844px;background:var(--cream);color:var(--ink);border-radius:28px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.25);position:relative;display:flex;flex-direction:column;font-size:15px;line-height:1.4}
@media (max-width:480px){.stage{padding:0}.phone{border-radius:0;max-height:none;width:100%;box-shadow:none}.bar{padding-block:6px;gap:6px}.bar .t{font-size:12.5px}.bar .t small{display:none}.seg{order:3;width:100%;display:flex}.seg.src{order:4}.seg button{flex:1;padding:6px 4px;font-size:11.5px}.bar .reset{font-size:11px;padding:5px 8px}
  .bar.collapsed .seg{display:none}}
.bar .sum{display:none;margin-left:auto;align-items:center;gap:6px;border:1.5px solid var(--bar-line);background:transparent;color:var(--fg);font-weight:800;font-size:11.5px;border-radius:8px;padding:5px 8px;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:480px){.bar .reset{margin-left:0}.bar .sum{display:inline-flex}}
/* small phones: tighter hero and footer so products stay above the fold */
@media (max-height:720px){.shopnote{display:none}.hero{padding:8px 14px 10px}.eq{padding:7px 6px;margin-top:2px}.eq-note{display:none}.bxs{height:16px;margin-bottom:3px}.bx{width:16px;height:16px}.bx:after{top:5px}.bx.g:before{left:6.5px}.stepsbar{margin-bottom:6px}.foot{padding:8px 12px 10px}.cta{padding:12px 14px;font-size:15px}.tile{padding:8px}.tile img{width:56px;height:56px}.tile{grid-template-columns:56px 1fr auto}}
@media (max-width:360px){.bar .reset .rl{display:none}.bar{gap:6px}.stepsbar div{font-size:9px;letter-spacing:0}.sline .ok{font-size:11.5px}.hrow{flex-wrap:wrap}.tpill{font-size:11px;padding:4px 8px}.eq-side b{font-size:14px}.eq-side small{white-space:normal}.sline{font-size:12px}.tile .n{font-size:13.5px}.addb{padding:8px 10px;font-size:12.5px}.vch .va{font-size:36px}.h1{font-size:20px}.em-body{padding:14px 14px}.wrap{padding:10px 12px 14px}}
.cta{white-space:normal}
.cta.sm{font-size:14px;padding:13px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:360px){.cta.sm{font-size:12.5px;padding:12px 8px}}
.tpill{min-width:0;overflow:hidden;text-overflow:ellipsis}
.eq-side small{white-space:normal}
.hdr>div:first-child{min-width:0}
.hdr b,.hdr small{overflow-wrap:anywhere}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;min-height:0}
.foot{background:#fffdfb;border-top:1.5px solid var(--ol);box-shadow:0 -4px 20px rgba(0,0,0,.08);padding:10px 14px 14px;position:relative;flex:none}
/* brand pieces */
.logo{height:24px;width:auto;display:block}
.hero{background:var(--bf);color:#fff;padding:12px 16px 14px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(232,114,42,.55),transparent 65%)}
.hero>*{position:relative}
.hrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.tpill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800;color:#fff;white-space:nowrap}
.tpill b{font-variant-numeric:tabular-nums;font-size:13px}
.tpill.hot{background:var(--o);border-color:var(--o)}
.eyebrow{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--o2);margin-bottom:8px}
.h1{font-size:22px;font-weight:900;line-height:1.12;text-wrap:balance}
.h1 em{font-style:normal;color:var(--o2)}
.sub{font-size:13.5px;color:rgba(255,255,255,.8);font-weight:600;margin-top:6px;line-height:1.45}
.wrap{padding:12px 16px 16px}
.h2{font-size:17px;font-weight:900;line-height:1.2;margin-bottom:8px}
.lead{font-size:13.5px;color:var(--mut);font-weight:600;margin:4px 0 10px}
.k2{font-size:11px;font-weight:800;color:var(--tan);text-transform:uppercase;letter-spacing:.07em;margin:14px 0 8px}
.card{background:#fff;border:1.5px solid var(--ol);border-radius:16px;padding:14px;box-shadow:0 6px 24px rgba(232,114,42,.10)}
.cta{display:block;width:100%;border:none;border-radius:14px;background:linear-gradient(135deg,var(--o),var(--o2));color:#fff;font-size:16px;font-weight:900;padding:14px 16px;text-align:center;box-shadow:0 6px 18px rgba(232,114,42,.35)}
.cta:disabled{background:#f6c9a6;box-shadow:none;cursor:not-allowed}
.cta.dark{background:var(--bf);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.cta.soft{background:#fff;color:var(--od);border:2px solid var(--o);box-shadow:none}
.cta small{display:block;font-size:12px;font-weight:700;opacity:.85;margin-top:2px}
.cta:focus-visible,.addb:focus-visible,.chip:focus-visible,button:focus-visible{outline:3px solid rgba(232,114,42,.5);outline-offset:2px}
.trust{font-size:11.5px;font-weight:600;color:var(--tan);text-align:center;margin-top:8px}
.input{display:flex;align-items:center;gap:8px;border:1.5px solid var(--ol);border-radius:12px;padding:0 12px;background:#fff;margin:10px 0}
.input input{flex:1;border:none;background:transparent;font:inherit;font-weight:600;font-size:15px;padding:12px 0;color:var(--ink);min-width:0;outline:none}
.input.err{border-color:#dc2626}
.bonus{display:grid;gap:8px;margin:8px 0 4px}
.bo{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:2px solid var(--ol);border-radius:14px;padding:9px 12px;background:#fff;text-align:left;width:100%;font:inherit;color:inherit}
.bo.on{border-color:var(--g);background:#fbfff9;box-shadow:0 0 0 3px rgba(22,163,74,.12)}
.bo .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--os);overflow:hidden}
.bo .ic img{width:42px;height:42px;object-fit:cover}
.bo b{font-size:14.5px;font-weight:900;display:block;line-height:1.15}
.bo small{font-size:12px;color:var(--tan);font-weight:600}
.bo .r{width:22px;height:22px;border-radius:50%;border:2px solid var(--ol);position:relative}
.bo.on .r{border-color:var(--g);background:var(--g)}
.bo.on .r:after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.strip{display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;border:1.5px solid var(--ol);border-radius:12px;padding:8px 10px;font-size:13px;font-weight:800;margin-bottom:10px;text-align:center}
.strip b{font-size:18px;font-weight:900}.strip .g{color:var(--gd)}.strip .eq{color:var(--o)}
.strip small{font-size:11px;font-weight:700;color:var(--tan);display:block;line-height:1.1}
.eqchips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.eqchips div{background:#fff;border:1.5px solid var(--ol);border-radius:10px;padding:6px 4px;text-align:center;font-size:12px;font-weight:800;color:var(--tan)}
.eqchips div b{display:block;font-size:16px;color:var(--ink)}.eqchips div b i{font-style:normal;color:var(--gd)}
.eqchips div.on{border-color:var(--o);background:var(--os)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:12.5px;font-weight:800;border-radius:999px;padding:6px 11px;background:#fff;border:1.5px solid var(--ol);color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.o{background:var(--os);color:var(--od)}
.selwrap{position:relative;margin-bottom:10px}
.selwrap label{position:absolute;left:12px;top:5px;font-size:10px;font-weight:800;color:var(--tan);text-transform:uppercase;letter-spacing:.07em;pointer-events:none}
.selwrap select{width:100%;appearance:none;-webkit-appearance:none;border:1.5px solid var(--ol);border-radius:12px;background:#fff;color:var(--ink);font:inherit;font-weight:900;font-size:15px;padding:18px 40px 8px 12px;outline:none}
.selwrap select:focus-visible{outline:3px solid rgba(232,114,42,.5)}
.selwrap .selarr{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--o);font-weight:900;pointer-events:none}
.strip.live{border-color:var(--g);background:#fbfff9}
.eq{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin-top:4px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 8px}
.eq-side{text-align:center;min-width:0}
.eq-side b{display:block;font-size:16px;font-weight:900;color:#fff;line-height:1.1;white-space:nowrap}
.eq-side small{display:block;font-size:11px;font-weight:700;color:rgba(255,255,255,.65);margin-top:2px;white-space:nowrap}
.eq-side.g b{color:#4ade80}
.eq-sign{width:30px;height:30px;border-radius:50%;background:var(--o);color:#fff;font-weight:900;font-size:17px;display:flex;align-items:center;justify-content:center}
.bxs{display:flex;justify-content:center;gap:4px;height:22px;margin-bottom:5px}
.bx{width:20px;height:20px;border-radius:5px;background:linear-gradient(135deg,var(--o),var(--o2));box-shadow:0 2px 6px rgba(0,0,0,.3);position:relative}
.bx:after{content:"";position:absolute;left:0;right:0;top:7px;height:3px;background:rgba(255,255,255,.45)}
.bx.g{background:linear-gradient(135deg,#22c55e,#4ade80)}
.bx.g:before{content:"";position:absolute;top:0;bottom:0;left:8.5px;width:3px;background:rgba(255,255,255,.55)}
.eq.pop .eq-side{animation:eqpop .45s cubic-bezier(.2,1.4,.4,1)}
.eq.pop .bx{animation:bxin .4s ease-out both}
.bx:nth-child(2){animation-delay:.08s}.bx:nth-child(3){animation-delay:.16s}.bx:nth-child(4){animation-delay:.24s}.bx:nth-child(5){animation-delay:.32s}
@keyframes eqpop{0%{transform:scale(.92);opacity:.4}100%{transform:none;opacity:1}}
@keyframes bxin{0%{transform:translateY(8px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.eq.pop .eq-side,.eq.pop .bx{animation:none}}
.vch{position:relative;background:linear-gradient(135deg,#e8722a 0%,#f59e0b 100%);color:#fff;border-radius:16px;padding:16px 18px 14px;box-shadow:0 10px 30px rgba(232,114,42,.35);overflow:hidden;margin:0 0 12px}
.vch:before,.vch:after{content:"";position:absolute;top:50%;width:26px;height:26px;border-radius:50%;background:var(--cream);transform:translateY(-50%)}
.vch:before{left:-13px}.vch:after{right:-13px}
.vch .vt{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.vch .va{font-size:44px;font-weight:900;line-height:1;margin:6px 0 2px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.vch .va small{font-size:18px;font-weight:800;vertical-align:top;margin-left:2px}
.vch .vs{font-size:12.5px;font-weight:700;opacity:.92}
.vch .vl{border-top:2px dashed rgba(255,255,255,.55);margin:12px 0 10px}
.vch .vb{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:800}
.vch .vcode{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;background:rgba(255,255,255,.18);border:1px dashed rgba(255,255,255,.6);border-radius:8px;padding:5px 9px}
.vch .vcode.lock{filter:blur(3px);user-select:none}
.vch .vtm{background:rgba(15,15,26,.35);border-radius:999px;padding:5px 10px;white-space:nowrap}
.vch .vtm b{font-variant-numeric:tabular-nums}
.vch .stamp{position:absolute;right:14px;top:12px;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;border:2px solid rgba(255,255,255,.8);border-radius:6px;padding:3px 6px;transform:rotate(8deg);opacity:.95}
.vch.ok{background:linear-gradient(135deg,#15803d,#22c55e);box-shadow:0 10px 30px rgba(22,163,74,.3)}
.vch .vlogo{height:18px;position:absolute;left:18px;top:14px;opacity:.95}
.howcard{background:#fff;border:1.5px solid var(--ol);border-radius:18px;padding:14px 12px 12px;box-shadow:0 6px 24px rgba(232,114,42,.10);overflow:hidden}
.hc-row{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:stretch}
.hc-col{background:var(--cream);border:1.5px solid var(--ol);border-radius:14px;padding:10px 6px 8px;text-align:center;min-width:0;display:flex;flex-direction:column;align-items:center}
.hc-col em{margin-top:auto!important;padding-top:0}
.hc-col small{margin-bottom:6px}
.hc-col.g{background:#f3fbf5;border-color:rgba(34,197,94,.35)}
.hc-col b{display:block;font-size:15px;font-weight:900;line-height:1.1;margin-top:6px}
.hc-col.g b{color:var(--gd)}
.hc-col small{display:block;font-size:11px;font-weight:700;color:var(--tan);line-height:1.2;margin-top:2px}
.hc-col em{display:inline-block;font-style:normal;font-size:12px;font-weight:900;color:var(--ink);background:#fff;border:1px solid var(--ol);border-radius:999px;padding:2px 8px;margin-top:6px}
.hc-col.g em{color:var(--gd);border-color:rgba(34,197,94,.35)}
.hc-imgs{display:flex;justify-content:center;gap:4px}
.hc-im{position:relative;width:46px;height:46px;border-radius:10px;overflow:hidden;border:2px solid var(--o);background:#fff;flex:none}
.hc-im img{width:100%;height:100%;object-fit:cover;display:block}
.hc-im.g{border-color:var(--g)}
.hc-im i{position:absolute;right:-3px;bottom:-3px;font-size:11px;font-style:normal;background:#fff;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.hc-arr{display:flex;align-items:center}
.hc-arr span{width:26px;height:26px;border-radius:50%;background:var(--o);color:#fff;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(232,114,42,.35)}
.hc-v{margin-top:8px;font-size:12px;font-weight:800;color:var(--goldd);background:#fff8e6;border:1px solid rgba(240,180,41,.5);border-radius:10px;padding:7px 10px;text-align:center}
.hc-sum{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;padding:10px 12px;background:var(--bf);color:#fff;border-radius:12px;font-size:13px;font-weight:700}
.hc-sum b{font-weight:900;color:#4ade80}.hc-sum>b{color:#fff;font-size:15px;white-space:nowrap}
.hc-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;position:relative}
.hc-steps:before{content:"";position:absolute;left:16%;right:16%;top:13px;height:2px;background:var(--ol)}
.hc-steps div{position:relative;text-align:center;font-size:11px;font-weight:700;color:var(--ink2);line-height:1.2}
.hc-steps i{display:flex;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-style:normal;font-weight:900;font-size:12px;align-items:center;justify-content:center;margin:0 auto 5px;border:3px solid #fff;box-sizing:content-box}
.hc-steps div:nth-child(2) i{background:var(--g)}.hc-steps div:nth-child(3) i{background:var(--o)}
@media (max-width:360px){.hc-im{width:40px;height:40px}.hc-col b{font-size:14px}.hc-steps div{font-size:10.5px}.hc-sum{font-size:12px}.hc-sum>b{font-size:13.5px}}
.hc-sum span{white-space:nowrap}
.affnote{font-size:12px;font-weight:700;color:#fff;background:rgba(232,114,42,.18);border:1px solid rgba(232,114,42,.45);border-radius:10px;padding:7px 10px;margin:0 0 8px}
.affnote b{color:var(--o2)}
.eq-note{font-size:11px;font-weight:700;color:rgba(255,255,255,.55);text-align:center;margin-top:6px}
.stepsbar{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:0 0 10px}
.stepsbar div{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:rgba(255,255,255,.55);border-top:3px solid rgba(255,255,255,.2);padding-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepsbar div.on{color:#fff;border-top-color:var(--o2)}
.stepsbar div.done{color:rgba(255,255,255,.8);border-top-color:var(--g)}
.hdr .stepsbar{flex:0 0 100%;margin:8px 0 0}
.hdr>div:first-child{flex:1 1 0}
.hdr .x{flex:none}
.tile .gl{display:inline-block;font-size:11.5px;font-weight:800;color:var(--gd);background:var(--gs);border-radius:6px;padding:2px 7px;margin-top:4px}
.strip-hint{font-size:11.5px;font-weight:600;color:var(--tan);text-align:center;margin:-6px 0 10px}
.tile{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;background:#fff;border:1.5px solid var(--ol);border-radius:14px;padding:10px;margin-bottom:8px;box-shadow:0 2px 10px rgba(232,114,42,.07)}
.tile>div{min-width:0}
.tile img{width:64px;height:64px;border-radius:10px;object-fit:cover;background:#f5efe8}
.tile .n{font-size:14.5px;font-weight:900;line-height:1.15}
.tile .n small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:11.5px;color:var(--tan);font-weight:600;margin-top:2px;overflow:hidden;line-height:1.25}
.tile .pr{font-size:14px;font-weight:800;color:var(--o);margin-top:3px}
.tile .pr s{font-size:11px;color:var(--tan2);font-weight:500;margin-right:4px}
.tile .pr.free{color:var(--gd)}
.tile.on{border-color:var(--g);background:#fbfff9}
.tile.go{border-style:dashed;background:#fffdf9}

const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT=null;
function toast(msg){ let t=phone.querySelector('.toast'); if(!t){ t=document.createElement('div'); t.className='toast'; phone.appendChild(t);} t.textContent=msg; clearTimeout(toastT); toastT=setTimeout(()=>{ t.remove(); },1600); }

/* ---------- derived ---------- */
const paidCount = () => Object.values(S.cart).reduce((a,b)=>a+b,0);
const giftCount = () => Object.values(S.gifts).reduce((a,b)=>a+b,0);
const subtotal = () => Object.entries(S.cart).reduce((a,[id,q])=>a+byId(id).pr*q,0);
const giftValue = () => Object.entries(S.gifts).reduce((a,[id,q])=>a+byId(id).pr*q,0);
const isEarly = () => S.phase==='early';
const shipping = () => paidCount()>=FREE_SHIP_FROM ? 0 : SHIP;
const inPre = () => ['wallet','precheckout','predone'].includes(S.screen);
const walletLive = () => S.walletExp && S.walletExp>Date.now();
const walletDiscount = () => { if(!inPre()||!walletLive()||!paidCount()) return 0; return Math.min(6.5, subtotal()); };
const affDiscount = () => (isEarly()&&isAff()&&S.email&&S.affBonus==='v10'&&paidCount()) ? Math.min(10, subtotal()) : 0;
const total = () => Math.max(0, subtotal()-walletDiscount()-affDiscount()+shipping());

/* ---------- timer ---------- */
function hms(ms){ ms=Math.max(0,ms); const h=Math.floor(ms/3600e3), m=Math.floor(ms%3600e3/60e3), s=Math.floor(ms%60e3/1e3); return [h,m,s].map(x=>String(x).padStart(2,'0')); }
setInterval(()=>{ phone.querySelectorAll('[data-cd]').forEach(el=>{ const ms=S[el.dataset.cd]-Date.now(); el.textContent=mmss(ms); if(ms<=0&&!el.dataset.done){ el.dataset.done='1'; render(); } }); const el=phone.querySelector('[data-timer]'); if(el){ const [h,m,s]=hms(S.deadline-Date.now()); el.textContent=`${h}:${m}:${s}`; } const t2=phone.querySelectorAll('[data-timer2]'); if(t2.length){ const [h,m,s]=hms(S.deadline-Date.now()); t2[0].textContent=h; if(t2[1]) t2[1].textContent=m; if(t2[2]) t2[2].textContent=s; } },1000);

/* ---------- views ---------- */
function productTile(p, mode){
  const q = mode==='gift' ? (S.gifts[p.id]||0) : (S.cart[p.id]||0);
  const free = mode==='gift';
  if(mode==='buy' && giftOnly(p)) return `<div class="tile go">
    <img src="${p.img}" alt="">
    <div><div class="n"><span class="nb">НОВО</span>${esc(p.n)}<small>${esc(p.s)}</small></div>
      <div class="pr free">само като подарък <s style="margin-left:4px">${fmt(p.pr)}</s></div>
      <button class="more" data-act="sheet" data-id="${p.id}">Прочети повече ▾</button></div>
    <button class="addb soft" data-act="giftonly" data-id="${p.id}">🎁 Подарък</button></div>`;
  const right = mode==='gift'
    ? (q ? `<div class="step"><button data-act="gift-" data-id="${p.id}" aria-label="минус">−</button><b>${q}</b><button data-act="gift+" data-id="${p.id}" ${giftCount()>=paidCount()?'disabled':''} aria-label="плюс">+</button></div>`
         : `<button class="addb${giftCount()>=paidCount()?'':''}" data-act="gift+" data-id="${p.id}" ${giftCount()>=paidCount()?'disabled':''}>🎁 Избирам</button>`)
    : (q ? `<div class="step"><button data-act="cart-" data-id="${p.id}" aria-label="минус">−</button><b>${q}</b><button data-act="cart+" data-id="${p.id}" aria-label="плюс">+</button></div>`
         : `<button class="addb" data-act="cart+" data-id="${p.id}">＋ Добави</button>`);
  return `<div class="tile${q?' on':''}">
    <img src="${p.img}" alt="">
    <div><div class="n">${p.isNew?'<span class="nb">НОВО</span>':''}${esc(p.n)}<small>${esc(p.s)}</small></div>
      <div class="pr${free?' free':''}">${free?`<s>${fmt(p.pr)}</s>подарък`:fmt(p.pr)}</div>
      ${(!free&&q&&!inPre())?`<div class="gl">🎁 носи ти +${q} ${q===1?'подарък':'подаръка'} по избор</div>`:''}
      <button class="more" data-act="sheet" data-id="${p.id}">Прочети повече ▾</button></div>
    ${right}</div>`;
}
function filtered(list){
  const f=S.filter;
  return list.filter(p => f==='all' || (f==='fav'&&p.fav) || (f==='new'&&p.isNew) || p.cat===f);
}
function catCount(k, pool){ return (pool||P.filter(p=>p.buy!==false&&!giftOnly(p))).filter(p => k==='all' || (k==='fav'&&p.fav) || (k==='new'&&p.isNew) || p.cat===k).length; }
function chips(pool){ const cats=CATS.filter(([k])=>catCount(k,pool)>0); if(!cats.some(([k])=>k===S.filter)) S.filter='all'; return `<div class="selwrap"><label for="catSel">Покажи</label><select id="catSel">${cats.map(([k,l])=>`<option value="${k}"${S.filter===k?' selected':''}>${l} (${catCount(k,pool)})</option>`).join('')}</select><span class="selarr">▾</span></div>`; }
function stepsBar(cur){ const L=['Продукти','Подаръци','Финализиране']; return `<div class="stepsbar">${L.map((l,i)=>`<div class="${i+1===cur?'on':i+1<cur?'done':''}">${l}</div>`).join('')}</div>`; }
function eqHtml(k, early){ const one=k===1; const bx=(c)=>Array.from({length:Math.min(k,5)},()=>`<i class="bx${c}"></i>`).join('')+(k>5?`<i class="bx${c}" style="opacity:.5"></i>`:''); return `<div class="eq-side"><div class="bxs">${bx('')}</div><b>${k} ${one?'опаковка':'опаковки'}</b><small>купуваш</small></div><div class="eq-sign">=</div><div class="eq-side g"><div class="bxs">${bx(' g')}</div><b>+${k} ${one?'подарък':'подаръка'}</b><small>по избор${early?` + ${k*VOUCHER} € ваучер${one?'':'и'}`:''}</small></div>`; }
function mechStrip(n, early){ const k=n||1; const one=k===1; return `<div class="strip${n?' live':''}"><span><b>${k}</b><small>${one?'опаковка':'опаковки'}</small></span><span class="eq">=</span><span class="g"><b>+${k}</b><small>${one?'подарък':'подаръка'} по избор</small></span>${early?`<span class="eq">+</span><span><b>${one?'10 €':k+'×10 €'}</b><small>${one?'ваучер':'ваучери'} 2027</small></span>`:''}</div>${n?'':'<div class="strip-hint">Добави опаковки — сметката се обновява сама.</div>'}`; }
function timerPill(){ const [h,m,s]=hms(S.deadline-Date.now()); return isEarly() ? `<span class="tpill">⏳ ранен достъп · <b data-timer>${h}:${m}:${s}</b></span>` : `<span class="tpill hot">BLACK FRIDAY · <b data-timer>${h}:${m}:${s}</b></span>`; }

function voucherCard(opts){ const o=Object.assign({amount:'6,50',locked:true,code:'ANSA650',cd:'coldExp',note:'важи 30 минути след отключването'},opts||{}); return `<div class="vch${o.locked?'':' ok'}"><img class="vlogo" src="img/logo-white.png" alt="ansa"><div class="stamp">${o.locked?'🔒 заключен':'✔ отключен'}</div><div class="vt" style="margin-top:14px">Твоят ваучер за</div><div class="va">${o.amount}<small>€</small></div><div class="vs">${o.locked?'за всичко в ansa.bg · '+o.note:'в портфейла ти · за всичко в ansa.bg'}</div><div class="vl"></div><div class="vb"><span class="vcode${o.locked?' lock':''}">${o.code}</span><span class="vtm">${o.locked?'изтича след':'важи още'} <b data-cd="${o.cd}">${mmss(S[o.cd]-Date.now())}</b></span></div></div>`; }
function bonusBtn(id, cur, ic, title, sub){ return `<button class="bo${cur===id?' on':''}" data-act="bonus" data-id="${id}"><span class="ic">${ic}</span><span><b>${title}</b><small>${sub}</small></span><span class="r"></span></button>`; }

  return `<div class="scroll"><div class="wrap">
    <div class="h2">Сторита на партньора (${AFF.name})</div>
    <p class="lead">Какво публикува афилиейтът и къде води линкът му. Кликни бутона, за да видиш страницата, която отваря последователят.</p>
    ${story('По време на ранния достъп · 2–3 сторита','Предварителен достъп + гарантиран подарък','С моя линк имате предварителен достъп до Черния петък на ANSA, с гарантиран подарък — влезте сега и разгледайте продуктите преди официалния старт.','Отвори страницата от линка →','go','aff')}
    ${story('По време на публичния старт · 1–2 сторита','Купуваш 1, получаваш 2 — и маска от мен','ANSA стартира тридневна промоция до изчерпване на количествата: купуваш 1, получаваш 2; купуваш 2, получаваш 4 — и така до безкрай. Имат и 4 нови продукта, влез и виж. С моя линк имаш допълнителен подарък — колагенова маска се добавя автоматично.','Отвори публичния BF →','go','public-aff')}
    <div class="footnote">Партньорът получава комисионата си по правилата на ANSA Partner (?ref=КОД, атрибуция при поръчка). Маската е купон MASK01, който се прилага автоматично за ref-трафик.</div>
  </div></div>`;
}
function vEmails(){
  const tabs = Object.entries(EMAILS).map(([k,e])=>`<button class="${S.emailView===k?'on':''}" data-act="emailview" data-id="${k}">${e.t}</button>`).join('') + `<button class="${S.emailView==='stories'?'on':''}" data-act="emailview" data-id="stories">📱 Сторита</button>`;
  return `<div class="emtabs">${tabs}</div>${S.emailView==='stories'?vStories():`<div class="scroll">${EMAILS[S.emailView].html()}</div>`}`;
}
function vSheet(){
  const p=byId(S.sheet); if(!p) return '';
  const tabs=[['desc','За какво'],['ing','Състав'],['how','Как се приема'],['who','За кого']];
  const body = {desc:`<p>${esc(p.desc)}</p>`, ing:`<p>${esc(p.ing)}</p>`, how:`<p>${esc(p.how)}</p>`, who:`<p>${esc(p.who)}</p>`}[S.tab];
  const inGifts = S.screen==='gifts';
  const canGift = giftCount()<paidCount();
  return `<button class="dim" data-act="sheet" data-id="" aria-label="затвори"></button><div class="sheet" role="dialog" aria-label="${esc(p.n)}">
    <div class="grab"></div><button class="shx" data-act="sheet" data-id="" aria-label="затвори">✕</button>
    <div class="sbody">
      <div class="ph"><img src="${p.img}" alt=""><div><div class="n">${esc(p.n)} ${p.isNew?'<span class="pillo">НОВО</span>':''}<small>${esc(p.s)} · 1 месец</small></div><div class="pr">${fmt(p.pr)} <span style="font-size:12px;color:var(--tan);font-weight:700">/ кутия</span></div></div></div>
      <div class="stars"><b>★★★★★</b> ${p.rv==='0'?'нов продукт · 216 дни разработка':p.rt+' · '+p.rv+' мнения'}</div>
      <div class="tabs">${tabs.map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-act="tab" data-id="${k}">${l}</button>`).join('')}</div>
      ${body}
      <p style="color:var(--tan);font-size:12.5px">${inGifts?'Избери го като подарък — не струва нищо.':(giftOnly(p)?'През Black Friday го получаваш само като подарък към опаковка.':'Подходящ и като подарък по избор към всяка опаковка.')}</p>
    </div>
    <div class="sfoot">${inGifts?`<button class="cta" data-act="gift+" data-id="${p.id}" ${canGift?'':'disabled'}>🎁 Избирам го като подарък</button>`:(giftOnly(p)?`<button class="cta" data-act="giftonly" data-id="${p.id}">🎁 Само като подарък · ${paidCount()?'избери го в стъпка 2':'първо добави опаковка'}</button><div class="trust">Новите продукти не се продават отделно през промото.</div>`:`<button class="cta" data-act="cart+" data-id="${p.id}">＋ Добави · ${fmt(p.pr)}</button><div class="trust">или го избери като подарък в следващата стъпка</div>`)}</div>
  </div>`;
}

/* demo cycle of the equation while the cart is empty */
setInterval(()=>{ const eq=document.getElementById('eq'); if(!eq||paidCount()) return; S.demoN=(S.demoN||1)%3+1; eq.dataset.n=S.demoN; eq.classList.remove('pop'); void eq.offsetWidth; eq.innerHTML=eqHtml(S.demoN,isEarly()); eq.classList.add('pop'); },2200);
/* ---------- render ---------- */
function screenFor(){
  if(S.phase==='emails') return 'emails';
  if(S.phase==='prep') return ['signup','done','wallet','precheckout','predone'].includes(S.screen)?S.screen:'signup';
  if(['signup','done','emails','wallet','precheckout','predone'].includes(S.screen)) return 'shop';
  return S.screen;
}
function render(){
  const sc=screenFor();
  const prevScroll = phone.querySelector('.scroll'); const keep = prevScroll && S._keepScroll ? prevScroll.scrollTop : 0; S._keepScroll=false;
  let html='';
  if(sc==='signup') html=vSignup(); else if(sc==='done') html=vSignupDone(); else if(sc==='wallet') html=vWallet(); else if(sc==='emails') html=vEmails(); else if(sc==='shop') html=vShop(); else if(sc==='gifts') html=vGifts(); else if(sc==='checkout'||sc==='precheckout') html=vCheckout(); else if(sc==='ordered'||sc==='predone') html=vDone(); else if(sc==='closed') html=vClosed();
  if(S.sheet) html+=vSheet();
  phone.innerHTML=html;
  const scr=phone.querySelector('.scroll'); if(scr && keep) scr.scrollTop=keep;
  document.querySelectorAll('#phaseSeg button').forEach(b=>b.classList.toggle('on',b.dataset.phase===S.phase));
  document.querySelectorAll('#srcSeg button').forEach(b=>b.classList.toggle('on',b.dataset.src===S.src));
  const sumEl=document.getElementById('barSum'); if(sumEl){ const ph={prep:'Подготовка',emails:'Имейли',early:'Ранен достъп',public:'Публичен BF'}[S.phase]; sumEl.textContent=`${ph} · ${isAff()?'🔗':'📣'} ▾`; }
  const f=document.getElementById('signupForm'); if(f){ f.addEventListener('submit',e=>{e.preventDefault(); const v=document.getElementById('emailIn').value.trim(); if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){S.emailErr=true;S.email=v;render();return;} S.email=v;S.emailErr=false;S.screen=isAff()?'done':'wallet'; if(!isAff()){S.walletExp=Date.now()+30*60e3;} save();render();}); const inp=document.getElementById('emailIn'); inp.addEventListener('input',()=>{S.email=inp.value;}); }
  const cs=document.getElementById('catSel'); if(cs){ cs.addEventListener('change',()=>{ S.filter=cs.value; S._keepScroll=true; render(); }); }
  const gs=document.getElementById('giftScroll')||document.getElementById('listScroll'); if(gs&&document.getElementById('morePill')){ const pill=document.getElementById('morePill'); const upd=()=>{ const tiles=[...gs.querySelectorAll('.tile')]; const below=tiles.filter(t=>t.offsetTop>gs.scrollTop+gs.clientHeight-20).length; const more=below>0 && gs.scrollHeight-gs.clientHeight-gs.scrollTop>40; pill.hidden=!more; if(more){ pill.textContent=`Скролни за още ${below} ${below===1?'продукт':'продукта'} ↓`; } }; gs.addEventListener('scroll',upd); upd(); }
  try{ const h='#'+((S.phase==='prep'&&isAff())?'aff':S.phase); if(location.hash!==h) history.replaceState(null,'',h); }catch(e){}
  save();
}

/* ---------- actions ---------- */
phone.addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, id=b.dataset.id;
  if(act==='bonus'){ if(isAff()) S.affBonus=id; else S.coldBonus=id; }
  else if(act==='faq'){ S.faq = S.faq===+id ? null : +id; S._keepScroll=true; }
  else if(act==='filter'){ S.filter=id; S._keepScroll=true; }
  else if(act==='cart+'){ S.cart[id]=(S.cart[id]||0)+1; S._keepScroll=!S.sheet; if(S.sheet){S.sheet=null;} toast(`${byId(id).n} добавен · ${paidCount()} ${paidCount()===1?'подарък':'подаръка'} по избор`); }
  else if(act==='cart-'){ if(S.cart[id]>1) S.cart[id]--; else delete S.cart[id]; trimGifts(); S._keepScroll=true; }
  else if(act==='gift+'){ if(giftCount()<paidCount()){ S.gifts[id]=(S.gifts[id]||0)+1; } S._keepScroll=!S.sheet; S.sheet=null; if(giftCount()===paidCount()) toast('Всички подаръци са избрани ✔'); }
  else if(act==='gift-'){ if(S.gifts[id]>1) S.gifts[id]--; else delete S.gifts[id]; S._keepScroll=true; }
  else if(act==='giftonly'){ S.sheet=null; if(paidCount()){ S.screen='gifts'; } else { toast('Новите продукти са само подаръци. Добави опаковка и го избери в стъпка 2.'); S._keepScroll=true; } }
  else if(act==='sheet'){ S.sheet=id||null; S.tab='desc'; S._keepScroll=true; }
  else if(act==='tab'){ S.tab=id; S._keepScroll=true; }
  else if(act==='screen'){ if(id==='gifts'&&!paidCount()) return; S.screen=id; }
  else if(act==='pay'){ S.pay=id; S._keepScroll=true; }
  else if(act==='order'){ S.screen = inPre() ? 'predone' : 'ordered'; }
  else if(act==='again'){ S.cart={}; S.gifts={}; S.screen='shop'; }
  else if(act==='go'){ if(id==='public-aff'){ S.src='aff'; setPhase('public'); return; } setPhase(id); return; }
  else if(act==='emailview'){ S.emailView=id; }
  else if(act==='email-cta'){ if(id==='preview'){ toast('Преди старта линкът води към страница само за разглеждане'); S.phase='early'; S.screen='shop'; } else { setPhase(id); return; } }
  else if(act==='toast'){ toast(id); return; }
  else if(act==='copy'){ const code=id; const done=()=>toast('Кодът '+code+' е копиран'); if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(code).then(done).catch(()=>toast('Кодът: '+code)); } else toast('Кодът: '+code); return; }
  else if(act==='scrolldown'){ const gs=document.getElementById('giftScroll')||document.getElementById('listScroll'); if(gs) gs.scrollBy({top:gs.clientHeight*0.8,behavior:'smooth'}); return; }
  render();
});
function trimGifts(){ let over=giftCount()-paidCount(); if(over<=0) return; for(const id of Object.keys(S.gifts).reverse()){ while(over>0&&S.gifts[id]>0){S.gifts[id]--;over--;} if(!S.gifts[id]) delete S.gifts[id]; if(over<=0) break; } }
function setPhase(ph){ if(ph==='aff'){ S.src='aff'; ph='prep'; } S.phase=ph; if(ph==='prep'){ if(!['signup','done','wallet','precheckout','predone'].includes(S.screen)) S.screen = S.email ? (isAff()?'done':'wallet') : 'signup'; if(isAff()&&['wallet','precheckout','predone'].includes(S.screen)) S.screen=S.email?'done':'signup'; if(!isAff()&&S.screen==='done') S.screen='wallet'; S.cart={}; S.gifts={}; } else if(ph==='early'||ph==='public'){ if(!['shop','gifts','checkout','ordered'].includes(S.screen)) S.screen='shop'; if(ph==='public'&&S.screen==='shop'){} } render(); }
document.getElementById('phaseSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b){ setPhase(b.dataset.phase); if(window.matchMedia('(max-width:480px)').matches) barEl.classList.add('collapsed'); } });
const barEl=document.querySelector('.bar'); barEl.classList.add('collapsed');
document.getElementById('barSum').addEventListener('click',()=>{ const c=barEl.classList.toggle('collapsed'); document.getElementById('barSum').setAttribute('aria-expanded', String(!c)); });
document.getElementById('srcSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; S.src=b.dataset.src; if(S.phase==='prep'){ S.screen = S.email ? (isAff()?'done':'wallet') : 'signup'; S.cart={}; } render(); });
document.getElementById('resetBtn').addEventListener('click',()=>{ S=S0(); try{sessionStorage.removeItem('ansa_bf_emu');}catch(e){} render(); });
window.addEventListener('hashchange',()=>{ const h=location.hash.replace('#',''); if(h==='aff'){ if(!(S.src==='aff'&&S.phase==='prep')) setPhase('aff'); return; } if(['prep','emails','early','public'].includes(h)&&h!==S.phase) setPhase(h); });
(function boot(){ const h=location.hash.replace('#',''); if(h==='aff'){ S.src='aff'; S.phase='prep'; } else if(['prep','emails','early','public'].includes(h)) S.phase=h; render(); })();
})();
</script>
