# Автоматичен Release: при всеки push в main чете версията от ansa-promo.php.
# Ако таг vX.Y.Z за нея още няма — прави ansa-promo.zip (папка ansa-promo/
# вътре, както WP го очаква) и ansa-probe.zip (ansa™ Probe, probe/), създава тага и Release-а. Плъгинът на сайта вижда
# новия release и предлага Update (или се обновява сам с auto-updates).
# Т.е. „нова версия“ = вдигни версията в ansa-promo.php и push-ни. Нищо друго.
# След release-а пингва сайта (proclaudecopilot GitHub Updater 1.1+ webhook) и той се обновява веднага —
# нужни са secrets PCC_HOOK_URL и PCC_HOOK_SECRET (Settings → GitHub ъпдейти на сайта); старите LOGADOR_HOOK_* още се приемат.
# Без тях само предупреждава — сайтът вижда версията при следващата си проверка.
# Ръчно „Run workflow“ (workflow_dispatch) само пингва сайта за текущата версия, ако тагът ѝ вече го има.
# ansa™ Meta (meta/ansa-meta/) е отделен плъгин със СВОЕ repo (proclaudecopilot/ansa-meta) и свой release workflow — не влиза в ansa-promo.zip и не се закача тук.
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency: release
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Read version
        id: v
        run: |
          VER=$(grep -m1 -E '^\s*\*\s*Version:' ansa-promo.php | sed -E 's/.*Version:\s*//; s/\s+$//')
          CONST=$(grep -m1 -E "define\(\s*'ANSA_PROMO_VER'" ansa-promo.php | sed -E "s/.*'ANSA_PROMO_VER'[^']*'([0-9.]+)'.*/\1/")
          echo "header=$VER const=$CONST"
          [ -n "$VER" ] && [ "$VER" = "$CONST" ] || { echo "::error::Version: ($VER) и ANSA_PROMO_VER ($CONST) не съвпадат"; exit 1; }
          if git ls-remote --exit-code --tags origin "v$VER" >/dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; echo "Таг v$VER вече има — няма нов release"; else echo "exists=0" >> "$GITHUB_OUTPUT"; fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
      - name: PHP lint
        if: steps.v.outputs.exists == '0'
        run: |
          sudo apt-get install -y -qq php-cli >/dev/null
          for f in $(find . -name '*.php' -not -path './.git/*'); do php -l "$f" >/dev/null || exit 1; done
      - name: Build zip
        if: steps.v.outputs.exists == '0'
        run: |
          mkdir -p build/ansa-promo
          rsync -a --exclude '.git' --exclude '.github' --exclude 'build' --exclude 'docs' --exclude 'landing' --exclude 'snippets' --exclude 'tests' --exclude 'probe' --exclude 'meta' --exclude '*.md' --exclude '.gitignore' --exclude '.gitattributes' ./ build/ansa-promo/
          cd build && zip -qr ../ansa-promo.zip ansa-promo && cd ..
          unzip -l ansa-promo.zip | tail -1
          # ansa™ Probe — отделен плъгин (качва се веднъж, ръчно); същият release го носи като ansa-probe.zip.
          # ИМЕТО Е ВАЖНО: GitHub подрежда asset-ите по име и updater ≤ 1.1.2 взема ПЪРВИЯ zip — „ansa-probe.zip“ стоеше преди
          # „ansa-promo.zip“ и 1.0.53 инсталира probe-а на мястото на промото. updater-ът ≥ 1.1.3 търси <slug>.zip (ansa-probe.zip ↔ slug ansa-probe), така че редът на asset-ите вече няма значение.
          cp -r probe/ansa-probe build/ansa-probe && cd build && zip -qr ../ansa-probe.zip ansa-probe && cd ..
          unzip -l ansa-probe.zip | tail -1
      - name: Release v${{ steps.v.outputs.ver }}
        if: steps.v.outputs.exists == '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.ver }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.v.outputs.ver }}
          files: ansa-promo.zip
          generate_release_notes: true
      - name: Attach ansa-probe.zip
        if: steps.v.outputs.exists == '0'
        continue-on-error: true   # мрежова грешка на GitHub тук не бива да спира ping-а на сайта
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.ver }}
          files: ansa-probe.zip
      - name: Ping сайта → обнови се сега
        # ръчно пускане (workflow_dispatch) винаги пингва — за „обнови сайта сега“ към вече качен release
        if: steps.v.outputs.exists == '0' || github.event_name == 'workflow_dispatch'
        env:
          URLS: ${{ secrets.PCC_HOOK_URL || secrets.LOGADOR_HOOK_URL }}      # старите имена на secrets работят, докато се преименуват
          SECRET: ${{ secrets.PCC_HOOK_SECRET || secrets.LOGADOR_HOOK_SECRET }}
          REPO: ${{ github.repository }}
          VER: ${{ steps.v.outputs.ver }}
        run: |
          if [ -z "$URLS" ] || [ -z "$SECRET" ]; then
            echo "::warning::Няма secrets PCC_HOOK_URL / PCC_HOOK_SECRET — сайтът ще види v$VER при следващата си проверка (до 6 ч + WP крон). Вземи ги от Settings → GitHub ъпдейти на сайта."
            exit 0
          fi
          sleep 5
          fail=0
          for URL in $(printf '%s' "$URLS" | tr ',;' '  '); do
            ok=0
            for i in 1 2 3; do
              echo "→ $URL (опит $i)"
              out=$(curl -sS -m 280 -X POST "$URL" -H "X-PCC-Secret: $SECRET" -H "X-Logador-Secret: $SECRET" --data-urlencode "repo=$REPO" -w '\nHTTP %{http_code}' || true)
              echo "$out"
              # успех = сайтът докладва ТОЧНО тази версия за ТОВА репо. HTTP кодът не е критерий: updater-ът връща 500 с ok:false,
              # щом КОЙТО И ДА Е следен плъгин не е успял (напр. Shrine с изключени auto-updates) — това се пише като warning, не проваля ping-а.
              good=$(printf '%s' "$out" | head -n1 | REPO="$REPO" VER="$VER" python3 -c 'import sys,json,os; d=json.load(sys.stdin); print(1 if any(p.get("repo")==os.environ["REPO"] and p.get("after")==os.environ["VER"] for p in d.get("plugins",[])) else 0)' 2>/dev/null || echo 0)
              others=$(printf '%s' "$out" | head -n1 | REPO="$REPO" python3 -c 'import sys,json,os; d=json.load(sys.stdin); print("; ".join(p.get("plugin","?")+" ("+p.get("repo","")+"): "+p["error"] for p in d.get("plugins",[]) if p.get("error") and p.get("repo")!=os.environ["REPO"]))' 2>/dev/null || true)
              [ -n "$others" ] && echo "::warning::Други плъгини на сайта не се обновиха: $others"
              if [ "$good" = 1 ]; then ok=1; break; fi
              case "$out" in *"HTTP 200"*|*"HTTP 500"*) echo "::warning::Сайтът отговори, но не докладва $REPO на версия $VER (плъгинът липсва или не се е обновил)";; esac
              sleep $((i*20))
            done
            [ "$ok" = 1 ] || { echo "::error::$URL не се обнови до v$VER — виж отговора горе (auto-updates за плъгина трябва да са включени)."; fail=1; }
          done
          exit $fail
